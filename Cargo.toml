[package]
name = "smoothy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "tracing"] }
dotenv = "0.15.0"
reqwest = {version = "0.12", features = ["json", "rustls-tls"]}
serenity = { version = "0.12.4", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "standard_framework", "voice", "cache", "http", "utils"] }
songbird = {version = "0.6.0", default-features = true, features = ["builtin-queue", "driver"]}
# songbird = {path = "crates", default-features = true, features = ["builtin-queue"]}
symphonia = { version = "0.5.5", features = [
    "aac",
    "mp3",
    "isomp4",
    "ogg",
    "vorbis",
    "flac",
    "wav",
    "pcm",
    "mkv"
] }
tracing = "0.1.40"
tracing-futures = "0.2.5"
tracing-subscriber = "0.3.18"
poise = { version = "0.6.1", default-features = false, features = ["cache"] }
# poise = { path = "crates/poise", default-features = false, features = ["cache"] }
sqlx = {version = "0.9.0", features = ["postgres", "runtime-tokio", "json", "tls-native-tls"]}
rusty_time = "1.1.0"
# futures = "0.3.30"
serde = {version = "1.0.196", features = ["derive"]}
rusty_ytdl = "0.7.4"
url = "2.5.4"
